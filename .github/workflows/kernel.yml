name: Guest kernel

# Builds the guest kernel (guest/kernel/build.sh) natively for each architecture and boot-tests it under the bundled
# QEMU, built here the same way qemu.yml builds it. Then boots a whole sandbox (kernel, agent as PID 1) through the
# host tool's supervisor with `oci-hermit machine boot`. Runs when the kernel, the QEMU build, the host tool or the
# agent changes, on main, and by hand.
on:
  push:
    branches: ["main"]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - guest/kernel/**
      - qemu/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - guest/kernel/**
      - qemu/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/kernel.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kernel:
    name: Build and boot (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: kernel-build qemu-build agent default
          cache: true
      - name: Cache the QEMU bundle
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: qemu/out
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qemu/build.sh', 'pixi.lock') }}
      - name: Build the QEMU bundle
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: pixi run -e qemu-build qemu-build
      - name: Cache the kernel
        id: kernel-cache
        uses: actions/cache@v6
        with:
          path: guest/out/${{ matrix.arch }}
          key: kernel-${{ matrix.arch }}-${{ hashFiles('guest/kernel/**', 'pixi.lock') }}
      - name: Build the kernel
        id: kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: pixi run -e kernel-build kernel-build "${{ matrix.arch }}" "guest/out/${{ matrix.arch }}"
      - name: Boot test
        run: |
          image=$(sed -n 's/^image=//p' "guest/out/${{ matrix.arch }}/BUNDLE.txt")
          bash guest/kernel/boot-test.sh "${{ matrix.arch }}" qemu/out "guest/out/${{ matrix.arch }}/$image" 180
      - name: Build the guest agent
        run: pixi run -e agent agent-build
      - name: Boot a sandbox through the supervisor
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
          OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
          TMPDIR: ${{ runner.temp }}
        run: |
          arch=${{ matrix.arch }}
          image=$(sed -n 's/^image=//p' "guest/out/$arch/BUNDLE.txt")
          mkdir -p "guest/out/sandbox/$arch"
          cp "guest/out/$arch/$image" "guest/out/sandbox/$arch/kernel"
          cp "target/$arch-unknown-linux-gnu/release/hermit-agent" "guest/out/sandbox/$arch/hermit-agent"
          pixi run cargo run -q -p oci-hermit -- machine boot --arch "$arch" --timeout 180
      - name: Run commands from a Debian image
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
          OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo amd64 || echo arm64)
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo --override-os linux --override-arch "$platform" \
            copy docker://quay.io/lib/debian:bookworm-slim oci-archive:debian.tar
          pixi run cargo build -q -p oci-hermit
          hermit=target/debug/oci-hermit

          # Output and the exit code come back.
          set +e
          # shellcheck disable=SC2016 # the single-quoted $(...) runs in the guest's shell
          out=$("$hermit" run debian.tar sh -c 'echo "hello from debian $(cat /etc/debian_version)"; exit 7')
          code=$?
          set -e
          echo "$out"
          [ "$code" = 7 ] || { echo "::error::exit code $code, expected 7"; exit 1; }
          grep -q '^hello from debian 12' <<< "$out"

          # Piped stdin reaches the command.
          [ "$(echo piped | "$hermit" run -i debian.tar cat)" = piped ]

          # With -t the command gets a terminal; script(1) gives oci-hermit one to put in raw mode.
          set +e
          script -qec "$hermit run -it debian.tar sh -c 'tty; exit 3'" /dev/null > tty.out
          code=$?
          set -e
          cat tty.out
          [ "$code" = 3 ] || { echo "::error::exit code $code with -t, expected 3"; exit 1; }
          grep -q '/dev/pts/' tty.out
      - name: Show the sandbox console
        if: ${{ !cancelled() }}
        run: cat "${{ runner.temp }}"/oci-hermit/sandbox-*/console.log "${{ runner.temp }}"/oci-hermit/sandbox-*/qemu.log || true
      # Also when the boot test fails, so the kernel can be booted and debugged elsewhere.
      - if: ${{ !cancelled() && (steps.kernel.outcome == 'success' || steps.kernel-cache.outputs.cache-hit == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: oci-hermit-kernel-${{ matrix.arch }}
          path: guest/out/${{ matrix.arch }}
          retention-days: 14
