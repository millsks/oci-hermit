name: Guest kernel

# Builds the guest kernel (guest/kernel/build.sh) natively for each architecture and boot-tests it under the bundled
# QEMU, built here the same way qemu.yml builds it. Then boots a whole sandbox (kernel, agent as PID 1) through the
# host tool's supervisor with `oci-hermit machine boot`, and runs commands from a Debian image with `oci-hermit run`.
# The hosts job then runs that image on Windows, macOS and Linux, for both guest architectures, with the kernel jobs'
# files. Runs when the kernel, the QEMU build, the host tool or the agent changes, on main, and by hand.
on:
  push:
    branches: ["main"]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - guest/kernel/**
      - qemu/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - guest/kernel/**
      - qemu/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/kernel.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kernel:
    name: Build and boot (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: kernel-build qemu-build agent default
          cache: true
      - name: Cache the QEMU bundle
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: qemu/out
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qemu/build.sh', 'qemu/patches/**', 'pixi.lock') }}
      - name: Build the QEMU bundle
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: pixi run -e qemu-build qemu-build
      - name: Cache the kernel
        id: kernel-cache
        uses: actions/cache@v6
        with:
          path: guest/out/${{ matrix.arch }}
          key: kernel-${{ matrix.arch }}-${{ hashFiles('guest/kernel/**', 'pixi.lock') }}
      - name: Build the kernel
        id: kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: pixi run -e kernel-build kernel-build "${{ matrix.arch }}" "guest/out/${{ matrix.arch }}"
      - name: Boot test
        run: |
          image=$(sed -n 's/^image=//p' "guest/out/${{ matrix.arch }}/BUNDLE.txt")
          bash guest/kernel/boot-test.sh "${{ matrix.arch }}" qemu/out "guest/out/${{ matrix.arch }}/$image" 180
      - name: Build the guest agent
        run: pixi run -e agent agent-build
      - name: Boot a sandbox through the supervisor
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
          OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
          TMPDIR: ${{ runner.temp }}
        run: |
          arch=${{ matrix.arch }}
          image=$(sed -n 's/^image=//p' "guest/out/$arch/BUNDLE.txt")
          mkdir -p "guest/out/sandbox/$arch"
          cp "guest/out/$arch/$image" "guest/out/sandbox/$arch/kernel"
          cp "target/$arch-unknown-linux-gnu/release/hermit-agent" "guest/out/sandbox/$arch/hermit-agent"
          pixi run cargo run -q -p oci-hermit -- machine boot --arch "$arch" --timeout 180
      - name: Run commands from a Debian image
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
          OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo amd64 || echo arm64)
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo --override-os linux --override-arch "$platform" \
            copy docker://public.ecr.aws/docker/library/debian:bookworm-slim oci-archive:debian.tar
          pixi run cargo build -q -p oci-hermit
          hermit=target/debug/oci-hermit

          # Output and the exit code come back.
          set +e
          # shellcheck disable=SC2016 # the single-quoted $(...) runs in the guest's shell
          out=$("$hermit" run debian.tar sh -c 'echo "hello from debian $(cat /etc/debian_version)"; exit 7')
          code=$?
          set -e
          echo "$out"
          [ "$code" = 7 ] || { echo "::error::exit code $code, expected 7"; exit 1; }
          grep -q '^hello from debian 12' <<< "$out"

          # Piped stdin reaches the command.
          [ "$(echo piped | "$hermit" run -i debian.tar cat)" = piped ]

          # With -t the command gets a terminal; script(1) gives oci-hermit one to put in raw mode.
          set +e
          script -qec "$hermit run -it debian.tar sh -c 'tty; exit 3'" /dev/null > tty.out
          code=$?
          set -e
          cat tty.out
          [ "$code" = 3 ] || { echo "::error::exit code $code with -t, expected 3"; exit 1; }
          grep -q '/dev/pts/' tty.out
      - name: Show the sandbox console
        if: ${{ !cancelled() }}
        run: cat "${{ runner.temp }}"/oci-hermit/sandbox-*/console.log "${{ runner.temp }}"/oci-hermit/sandbox-*/qemu.log || true
      # The guest files and the image for the hosts job: they run inside the guest, so any host can use them.
      - uses: actions/upload-artifact@v7
        with:
          name: sandbox-${{ matrix.arch }}
          path: |
            guest/out/sandbox/${{ matrix.arch }}
            debian.tar
          retention-days: 14
          if-no-files-found: error
      # Also when the boot test fails, so the kernel can be booted and debugged elsewhere.
      - if: ${{ !cancelled() && (steps.kernel.outcome == 'success' || steps.kernel-cache.outputs.cache-hit == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: oci-hermit-kernel-${{ matrix.arch }}
          path: guest/out/${{ matrix.arch }}
          retention-days: 14

  # A Linux image on every host oci-hermit supports, for both guest architectures: no root or admin rights, no WSL,
  # no hypervisor; QEMU emulates the whole guest (TCG). The guest kernel, agent and image come from the kernel jobs.
  hosts:
    name: Run a Linux image (${{ matrix.host }} host, ${{ matrix.arch }} guest)
    needs: kernel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        host: [win-64, osx-arm64, osx-64, linux-64, linux-aarch64]
        arch: [x86_64, aarch64]
        include:
          - { host: win-64, os: windows-latest }
          - { host: osx-arm64, os: macos-latest }
          - { host: osx-64, os: macos-15-intel }
          - { host: linux-64, os: ubuntu-latest }
          - { host: linux-aarch64, os: ubuntu-24.04-arm }
    env:
      OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
      OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
    steps:
      - uses: actions/checkout@v7
      # Built as qemu.yml builds it, only when its inputs change; the key matches the kernel jobs' on Linux.
      - name: Cache the QEMU bundle
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: qemu/out
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qemu/build.sh', 'qemu/patches/**', 'pixi.lock') }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ runner.os == 'Windows' && 'default' || 'default qemu-build' }}
          cache: true
      - if: steps.qemu-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        name: Build the QEMU bundle
        run: pixi run -e qemu-build qemu-build
      - if: steps.qemu-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            patch
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
      - if: steps.qemu-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        name: Build the QEMU bundle (MSYS2)
        shell: msys2 {0}
        run: |
          python -m pip install --break-system-packages "qemu.qmp==0.0.6"
          bash qemu/build.sh qemu/out
      - name: Fetch the guest kernel, agent and Debian image
        uses: actions/download-artifact@v8
        with:
          name: sandbox-${{ matrix.arch }}
      # Release, so the timings below match what users get.
      - name: Build oci-hermit
        run: pixi run cargo build -q --release -p oci-hermit
      # Sandboxes keep their logs under the temp directory; they are shown at the end.
      - name: Use the runner's temp directory
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Boot a sandbox
        shell: bash
        run: target/release/oci-hermit machine boot --arch "${{ matrix.arch }}" --timeout 600
      - name: Run commands from the Debian image
        shell: bash
        run: |
          set -euo pipefail
          hermit=target/release/oci-hermit
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          case "$RUNNER_OS" in
            Windows) host=$(cmd //c ver | tr -d '\r' | grep -v '^$') ;;
            macOS) host="macOS $(sw_vers -productVersion) on $(uname -m)" ;;
            *) host="$(. /etc/os-release; echo "$PRETTY_NAME") on $(uname -m)" ;;
          esac
          # shellcheck disable=SC2016 # expands in the guest's shell
          show='. /etc/os-release; echo "$PRETTY_NAME on $(uname -m), kernel $(uname -r)"; id; exit 7'

          # Output and the exit code come back.
          set +e
          out=$("$hermit" run --platform "$platform" debian.tar sh -c "$show")
          code=$?
          set -e
          echo "$out"
          [ "$code" = 7 ] || { echo "::error::exit code $code, expected 7"; exit 1; }
          grep -q '^Debian GNU/Linux 12' <<< "$out"

          # Piped stdin reaches the command.
          piped=$(echo "piped from the host" | "$hermit" run -i --platform "$platform" debian.tar cat)
          [ "$piped" = "piped from the host" ] || { echo "::error::stdin came back as '$piped'"; exit 1; }

          # With -t the command gets a terminal in the guest (the runner has no console to put in raw mode).
          set +e
          tty=$("$hermit" run -t --platform "$platform" debian.tar sh -c 'tty; exit 3' | tr -d '\r')
          code=${PIPESTATUS[0]}
          set -e
          echo "$tty"
          [ "$code" = 3 ] || { echo "::error::exit code $code with -t, expected 3"; exit 1; }
          grep -q '/dev/pts/' <<< "$tty"

          # -u runs the command as another user from the image's /etc/passwd, with that user's HOME.
          # shellcheck disable=SC2016 # expands in the guest's shell
          who=$("$hermit" run -u nobody --platform "$platform" debian.tar sh -c 'id; echo "HOME=$HOME"')
          echo "$who"
          expected=$'uid=65534(nobody) gid=65534(nogroup) groups=65534(nogroup)\nHOME=/nonexistent'
          [ "$who" = "$expected" ] || { echo "::error::-u nobody ran as '$who'"; exit 1; }

          {
            echo "## ${{ matrix.host }} host, ${{ matrix.arch }} guest"
            echo
            echo "Host: $host. No root or admin rights, no WSL, no hypervisor: QEMU TCG."
            echo
            echo '```console'
            echo "$ oci-hermit run --platform $platform debian.tar sh -c '...; exit 7'"
            echo "$out"
            echo "(exit code 7)"
            echo "$ echo \"piped from the host\" | oci-hermit run -i --platform $platform debian.tar cat"
            echo "$piped"
            echo "$ oci-hermit run -t --platform $platform debian.tar sh -c 'tty; exit 3'"
            echo "$tty"
            echo "(exit code 3)"
            echo "$ oci-hermit run -u nobody --platform $platform debian.tar sh -c 'id; echo \"HOME=\$HOME\"'"
            echo "$who"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # #14: pull by reference over HTTPS (every digest checked), then run it from the store by name.
      - name: Pull from a registry and run by name
        shell: bash
        env:
          OCI_HERMIT_DATA_DIR: ${{ runner.temp }}/hermit-data
        run: |
          set -euo pipefail
          hermit=target/release/oci-hermit
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          image=public.ecr.aws/docker/library/debian:bookworm-slim
          pulled=$("$hermit" pull --platform "$platform" "$image")
          echo "$pulled"
          grep -q "^Status: pulled $image for $platform$" <<< "$pulled"
          # shellcheck disable=SC2016 # expands in the guest's shell
          out=$("$hermit" run --platform "$platform" "$image" sh -c '. /etc/os-release; echo "$PRETTY_NAME"')
          echo "$out"
          grep -q '^Debian GNU/Linux 12' <<< "$out"
          {
            echo
            echo "### Pulled from a registry"
            echo
            echo '```console'
            echo "$ oci-hermit pull --platform $platform $image"
            echo "$pulled"
            echo "$ oci-hermit run --platform $platform $image sh -c '. /etc/os-release; echo \"\$PRETTY_NAME\"'"
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # #15: what `docker save` writes, loaded offline and run by name. Only the Ubuntu runners have Docker.
      - name: Load a docker save archive
        if: matrix.host == 'linux-64'
        shell: bash
        env:
          OCI_HERMIT_DATA_DIR: ${{ runner.temp }}/hermit-load
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          image=public.ecr.aws/docker/library/debian:bookworm-slim
          for attempt in 1 2 3 4; do
            docker pull --platform "$platform" "$image" && break
            sleep $((attempt * 5))
          done
          docker save -o "$RUNNER_TEMP/debian-docker.tar" "$image"
          loaded=$(target/release/oci-hermit load -i "$RUNNER_TEMP/debian-docker.tar")
          echo "$loaded"
          grep -q "^Loaded image: $image ($platform)$" <<< "$loaded"
          # shellcheck disable=SC2016 # expands in the guest's shell
          out=$(target/release/oci-hermit run --platform "$platform" "$image" sh -c '. /etc/os-release; echo "$PRETTY_NAME"')
          echo "$out"
          grep -q '^Debian GNU/Linux 12' <<< "$out"
          {
            echo
            echo "### Loaded from docker save"
            echo
            echo '```console'
            echo "$ docker save -o debian-docker.tar $image"
            echo "$ oci-hermit load -i debian-docker.tar"
            echo "$loaded"
            echo "$ oci-hermit run --platform $platform $image sh -c '. /etc/os-release; echo \"\$PRETTY_NAME\"'"
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure the time to a shell
        shell: bash
        env:
          OCI_HERMIT_TIMINGS: "1"
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          {
            echo
            echo "### Time to a shell"
            echo
            echo "\`oci-hermit run --platform $platform debian.tar bash -ic exit\`, three runs, seconds:"
            echo
            echo "| Run | Prepare | Boot | Command | Stop | Total |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2 3; do
            line=$(target/release/oci-hermit run --platform "$platform" debian.tar bash -ic exit 2>&1 >/dev/null | tr -d '\r' | grep '^timings:')
            echo "$line"
            # "timings: prepare 0.27s, boot 1.10s, ..." -> "| 1 | 0.27 | 1.10 | ..."
            echo "| $run | $(sed -E -e 's/^timings: //' -e 's/[a-z]+ ([0-9.]+)s/\1/g' -e 's/, / | /g' <<< "$line") |" >> "$GITHUB_STEP_SUMMARY"
          done
      # #13: the same image again, run by a fresh account with no admin rights from a folder it cannot write to.
      - name: Run as a standard user (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          if [ "$RUNNER_OS" = macOS ]; then
            sudo sysadminctl -addUser hermit -password "$(uuidgen)" 2> /dev/null
            membership=$(dseditgroup -o checkmember -m hermit admin || true)
            grep -q 'NOT a member' <<< "$membership"
          else
            sudo useradd --create-home hermit
            membership="hermit is in: $(id -nG hermit)"
            if grep -qwE 'sudo|admin|adm|wheel|kvm|docker|lxd' <<< "$(id -nG hermit)"; then
              echo "::error::$membership"
              exit 1
            fi
            # Take KVM away entirely, so a run that worked cannot have used it.
            if [ -e /dev/kvm ]; then sudo chmod 0600 /dev/kvm; fi
          fi

          install=/opt/oci-hermit
          sudo mkdir -p "$install"
          sudo cp target/release/oci-hermit debian.tar "$install/"
          sudo cp -R qemu/out "$install/qemu"
          sudo cp -R guest/out/sandbox "$install/guest"
          sudo chown -R root "$install"
          sudo chmod -R go-w,a+rX "$install"
          tmp=$(sudo -u hermit mktemp -d /tmp/hermit.XXXXXX)
          as_hermit() {
            sudo -u hermit env -i PATH=/usr/bin:/bin HOME="$tmp" TMPDIR="$tmp" \
              OCI_HERMIT_QEMU_DIR="$install/qemu" OCI_HERMIT_GUEST_DIR="$install/guest" "$@"
          }

          id=$(as_hermit id)
          echo "$id"
          if as_hermit sudo -n true 2> /dev/null; then
            echo "::error::hermit can use sudo"
            exit 1
          fi
          if as_hermit test -w "$install"; then
            echo "::error::hermit can write to $install"
            exit 1
          fi
          kvm=$([ -e /dev/kvm ] && ls -l /dev/kvm || echo "no /dev/kvm")

          set +e
          # shellcheck disable=SC2016 # expands in the guest's shell
          out=$(as_hermit "$install/oci-hermit" run --platform "$platform" "$install/debian.tar" \
            sh -c '. /etc/os-release; echo "$PRETTY_NAME on $(uname -m)"; exit 7')
          code=$?
          set -e
          echo "$out"
          [ "$code" = 7 ] || { echo "::error::exit code $code as a standard user, expected 7"; exit 1; }
          grep -q '^Debian GNU/Linux 12' <<< "$out"

          {
            echo
            echo "### As a standard user"
            echo
            echo "A new account with no admin rights ran oci-hermit from \`$install\`, which it cannot write to."
            echo "\`sudo -n true\` failed for it. KVM: $kvm."
            echo
            echo '```console'
            echo "$ id"
            echo "$id"
            echo "$membership"
            echo "$ oci-hermit run --platform $platform debian.tar sh -c '...; exit 7'"
            echo "$out"
            echo "(exit code 7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run as a standard user (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = if ('${{ matrix.arch }}' -eq 'x86_64') { 'linux/amd64' } else { 'linux/arm64' }
          $password = ConvertTo-SecureString ('Hx1!' + [guid]::NewGuid()) -AsPlainText -Force
          New-LocalUser -Name hermit -Password $password -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member hermit

          # Installed where only administrators can write, with a work folder the account owns.
          $install = 'C:\oci-hermit'
          $work = 'C:\hermit-work'
          New-Item -ItemType Directory $install, $work, "$work\tmp" | Out-Null
          Copy-Item target\release\oci-hermit.exe, debian.tar $install
          Copy-Item -Recurse qemu\out "$install\qemu"
          Copy-Item -Recurse guest\out\sandbox "$install\guest"
          @"
          @echo off
          set TMP=$work\tmp
          set TEMP=$work\tmp
          set OCI_HERMIT_QEMU_DIR=$install\qemu
          set OCI_HERMIT_GUEST_DIR=$install\guest
          whoami > $work\whoami.txt
          whoami /groups /fo csv > $work\groups.txt
          whoami /priv /fo csv > $work\priv.txt
          (echo x> $install\probe.txt) 2> nul && echo writable> $work\install-writable.txt
          $install\oci-hermit.exe run --platform $platform $install\debian.tar sh -c ". /etc/os-release; echo `$PRETTY_NAME on `$(uname -m); exit 7" > $work\out.txt 2> $work\err.txt
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Encoding ascii "$install\as-hermit.cmd"
          icacls $install /inheritance:r /grant:r 'Administrators:(OI)(CI)F' 'SYSTEM:(OI)(CI)F' 'Users:(OI)(CI)RX' | Out-Null
          icacls $work /inheritance:r /grant:r 'Administrators:(OI)(CI)F' 'SYSTEM:(OI)(CI)F' 'hermit:(OI)(CI)M' | Out-Null

          $credential = New-Object System.Management.Automation.PSCredential('hermit', $password)
          $p = Start-Process cmd.exe -ArgumentList '/c', "$install\as-hermit.cmd" -Credential $credential `
            -WorkingDirectory $work -LoadUserProfile -Wait -PassThru
          $code = $p.ExitCode
          $whoami = (Get-Content "$work\whoami.txt" -Raw).Trim()
          $groups = Get-Content "$work\groups.txt" -Raw
          $privileges = Get-Content "$work\priv.txt" -Raw
          $out = (Get-Content "$work\out.txt" -Raw).Trim()
          Write-Output "whoami: $whoami" $groups $privileges $out
          Get-Content "$work\err.txt"

          if ($whoami -notmatch '\\hermit$') { throw "ran as $whoami, not hermit" }
          if ($groups -match 'S-1-5-32-544') { throw 'hermit is in the Administrators group' }
          if ($groups -notmatch 'Medium Mandatory Level') { throw 'hermit does not run at medium integrity' }
          if (Test-Path "$work\install-writable.txt") { throw "hermit can write to $install" }
          if ($code -ne 7) { throw "exit code $code as a standard user, expected 7" }
          if ($out -notmatch '^Debian GNU/Linux 12') { throw "unexpected output: $out" }

          $summary = @(
            '', '### As a standard user', '',
            "A new account in the Users group only ran oci-hermit from ``$install``, which it cannot write to.",
            'It is not in Administrators (S-1-5-32-544) and runs at medium integrity, with no elevation.', '',
            '```console', "> whoami", $whoami, '> whoami /groups (names only)',
            (($groups | ConvertFrom-Csv).'Group Name' -join "`n"),
            "> oci-hermit run --platform $platform debian.tar sh -c '...; exit 7'", $out, '(exit code 7)', '```'
          )
          $summary -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Show the sandbox console
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP" 2> /dev/null || echo "$RUNNER_TEMP")
          cat "$temp"/oci-hermit/sandbox-*/console.log "$temp"/oci-hermit/sandbox-*/qemu.log || true
          # The standard user's sandboxes, from the steps above.
          if [ "$RUNNER_OS" = Windows ]; then
            cat /c/hermit-work/tmp/oci-hermit/sandbox-*/*.log /c/hermit-work/*.txt 2> /dev/null || true
          else
            sudo sh -c 'cat /tmp/hermit.*/oci-hermit/sandbox-*/*.log' 2> /dev/null || true
          fi
