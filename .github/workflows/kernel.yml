name: Guest kernel

# Builds the guest kernel (guest/kernel/build.sh) natively for each architecture and boot-tests it under the bundled
# QEMU, built here the same way qemu.yml builds it. Then boots a whole sandbox (kernel, agent as PID 1) through the
# host tool's supervisor with `oci-hermit machine boot`, and runs commands from a Debian image with `oci-hermit run`.
# The hosts job then runs that image on Windows, macOS and Linux, for both guest architectures, with the kernel jobs'
# files. Runs when the kernel, the QEMU build, the host tool or the agent changes, on main, and by hand.
on:
  push:
    branches: ["main"]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - guest/kernel/**
      - guest/crun/**
      - qemu/**
      - packaging/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - guest/kernel/**
      - guest/crun/**
      - qemu/**
      - packaging/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/kernel.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kernel:
    name: Build and boot (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: kernel-build crun-build qemu-build agent package default
          cache: true
      - name: Cache the QEMU bundle
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: qemu/out
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qemu/build.sh', 'qemu/patches/**', 'packaging/licenses.py', 'pixi.lock') }}
      - name: Build the QEMU bundle
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: pixi run -e qemu-build qemu-build
      - name: Cache the kernel
        id: kernel-cache
        uses: actions/cache@v6
        with:
          path: guest/out/${{ matrix.arch }}
          key: kernel-${{ matrix.arch }}-${{ hashFiles('guest/kernel/**', 'pixi.lock') }}
      - name: Build the kernel
        id: kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: pixi run -e kernel-build kernel-build "${{ matrix.arch }}" "guest/out/${{ matrix.arch }}"
      - name: Boot test
        run: |
          image=$(sed -n 's/^image=//p' "guest/out/${{ matrix.arch }}/BUNDLE.txt")
          bash guest/kernel/boot-test.sh "${{ matrix.arch }}" qemu/out "guest/out/${{ matrix.arch }}/$image" 180
      - name: Build the guest agent
        run: pixi run -e agent agent-build
      - name: Cache crun
        id: crun-cache
        uses: actions/cache@v6
        with:
          path: guest/out/crun-${{ matrix.arch }}
          key: crun-${{ matrix.arch }}-${{ hashFiles('guest/crun/**', 'pixi.lock') }}
      - name: Build crun
        if: steps.crun-cache.outputs.cache-hit != 'true'
        run: pixi run -e crun-build crun-build "${{ matrix.arch }}" "guest/out/crun-${{ matrix.arch }}"
      - name: Boot a sandbox through the supervisor
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
          OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
          TMPDIR: ${{ runner.temp }}
        run: |
          arch=${{ matrix.arch }}
          image=$(sed -n 's/^image=//p' "guest/out/$arch/BUNDLE.txt")
          mkdir -p "guest/out/sandbox/$arch"
          cp "guest/out/$arch/$image" "guest/out/sandbox/$arch/kernel"
          cp "target/$arch-unknown-linux-gnu/release/hermit-agent" "guest/out/sandbox/$arch/hermit-agent"
          cp "guest/out/crun-$arch/crun" "guest/out/sandbox/$arch/crun"
          # The kernel's license (from its build), glibc's (statically linked into the agent and crun) and those of
          # crun and its libraries, for the packages.
          rm -rf "guest/out/sandbox/$arch/licenses"
          cp -R "guest/out/$arch/licenses" "guest/out/sandbox/$arch/licenses"
          pixi run -e package python -I packaging/licenses.py glibc "guest/out/sandbox/$arch" "$PWD/.pixi/envs/agent"
          pixi run -e package python -I packaging/licenses.py crun "guest/out/sandbox/$arch" "guest/out/crun-$arch"
          pixi run -e package python -I packaging/licenses.py seccomp "guest/out/sandbox/$arch" crates/hermit-agent/seccomp
          pixi run cargo run -q -p oci-hermit -- machine boot --arch "$arch" --timeout 180
      - name: Run commands from a Debian image
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
          OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo amd64 || echo arm64)
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo --override-os linux --override-arch "$platform" \
            copy docker://mirror.gcr.io/library/debian:bookworm-slim oci-archive:debian.tar
          pixi run cargo build -q -p oci-hermit
          hermit=target/debug/oci-hermit

          # Output and the exit code come back.
          set +e
          # shellcheck disable=SC2016 # the single-quoted $(...) runs in the guest's shell
          out=$("$hermit" run debian.tar sh -c 'echo "hello from debian $(cat /etc/debian_version)"; exit 7')
          code=$?
          set -e
          echo "$out"
          [ "$code" = 7 ] || { echo "::error::exit code $code, expected 7"; exit 1; }
          grep -q '^hello from debian 12' <<< "$out"

          # Piped stdin reaches the command.
          [ "$(echo piped | "$hermit" run -i debian.tar cat)" = piped ]

          # With -t the command gets a terminal; script(1) gives oci-hermit one to put in raw mode.
          set +e
          script -qec "$hermit run -it debian.tar sh -c 'tty; exit 3'" /dev/null > tty.out
          code=$?
          set -e
          cat tty.out
          [ "$code" = 3 ] || { echo "::error::exit code $code with -t, expected 3"; exit 1; }
          grep -q '/dev/pts/' tty.out

          # The command runs in a container (crun): PID 1 in its own namespace, named by its short ID, with Docker's
          # default capabilities, a read-only /sys and no way to open the layer disks.
          # shellcheck disable=SC2016 # the single-quoted commands run in the guest's shell
          inside=$("$hermit" run debian.tar sh -c 'echo "pid=$$"; hostname; grep CapEff /proc/self/status; \
            mknod /tmp/vda b 254 0 && { head -c1 /tmp/vda > /dev/null 2>&1 && echo disk-readable || echo disk-denied; }; \
            touch /sys/probe 2> /dev/null && echo sys-writable || echo sys-read-only')
          echo "$inside"
          grep -qx 'pid=1' <<< "$inside"
          grep -qxE '[0-9a-f]{12}' <<< "$inside"
          grep -qx 'CapEff:.00000000a80425fb' <<< "$inside"
          grep -qx 'disk-denied' <<< "$inside"
          grep -qx 'sys-read-only' <<< "$inside"
          # Another user gets no capabilities at all.
          grep -qx 'CapEff:.0000000000000000' <<< "$("$hermit" run -u nobody debian.tar grep CapEff /proc/self/status)"
          # Docker's default seccomp profile (#102): a filter is on, and what it blocks fails with EPERM, keyctl
          # included, which no capability guards. Raw syscalls (perl-base is in every Debian image), by number:
          # unshare, mount, keyctl.
          [ "$("$hermit" run debian.tar sh -c 'grep "^Seccomp:" /proc/self/status | cut -f2')" = 2 ]
          # shellcheck disable=SC2016 # runs in the guest's perl
          errnos=$("$hermit" run debian.tar perl -e '
            my @n = `uname -m` =~ /x86_64/ ? (272, 165, 250) : (97, 40, 219);
            print join(" ", map { syscall($_, 0, 0, 0, 0, 0) == -1 ? $!+0 : "ok" } @n), "\n"')
          [ "$errnos" = "1 1 1" ] || { echo "::error::unshare, mount, keyctl gave '$errnos', expected EPERM (1) each"; exit 1; }
          # A command the image does not have fails before the container starts.
          set +e
          "$hermit" run debian.tar no-such-command 2> missing.err
          code=$?
          set -e
          cat missing.err
          [ "$code" = 125 ] || { echo "::error::exit code $code for a missing command, expected 125"; exit 1; }
          grep -q 'executable file not found' missing.err

          # run -d returns once the command started; logs -f follows its output until it exits, and ps records how.
          # shellcheck disable=SC2016 # expands in the guest's shell
          "$hermit" run -d --name counter debian.tar sh -c 'for i in 1 2 3; do echo "n$i"; sleep 1; done; exit 4' > /dev/null
          followed=$("$hermit" logs -f counter)
          [ "$followed" = $'n1\nn2\nn3' ] || { echo "::error::logs -f showed '$followed'"; exit 1; }
          "$hermit" ps -a | grep ' counter$' | grep -q 'Exited (4)'
          # rm -f stops a running container and removes it.
          "$hermit" run -d --name idle debian.tar sleep 1000 > /dev/null
          "$hermit" ps | grep -q ' idle$'
          # exec runs more commands in the running container: its PID 1, files and namespaces, with its own exit
          # code, user, directory, environment, stdin and terminal.
          pid1=$("$hermit" exec idle sh -c 'tr "\0" " " < /proc/1/cmdline')
          [ "$pid1" = "sleep 1000 " ] || { echo "::error::exec saw PID 1 as '$pid1'"; exit 1; }
          "$hermit" exec idle sh -c 'echo shared > /tmp/note'
          [ "$("$hermit" exec idle cat /tmp/note)" = shared ] || { echo "::error::exec did not share the container's files"; exit 1; }
          [ "$("$hermit" exec -u nobody idle id -u)" = 65534 ]
          [ "$("$hermit" exec idle sh -c 'grep "^Seccomp:" /proc/self/status | cut -f2')" = 2 ]
          # shellcheck disable=SC2016 # expands in the guest's shell
          [ "$("$hermit" exec -w /tmp -e GREETING=hello idle sh -c 'echo "$GREETING from $(pwd)"')" = "hello from /tmp" ]
          [ "$(echo piped | "$hermit" exec -i idle cat)" = piped ]
          "$hermit" exec -t idle tty | grep -q '^/dev/pts/'
          code=0; "$hermit" exec idle sh -c 'exit 6' || code=$?
          [ "$code" = 6 ] || { echo "::error::exec exited with $code, not 6"; exit 1; }
          code=0; "$hermit" exec idle no-such-command 2> exec.err || code=$?
          if [ "$code" != 125 ] || ! grep -q 'executable file not found' exec.err; then cat exec.err; exit 1; fi
          "$hermit" rm -f idle
          if "$hermit" ps -a | grep -q ' idle$'; then echo "::error::rm -f left idle"; exit 1; fi
          # stop sends SIGTERM first: a command that handles it ends on its own terms.
          # shellcheck disable=SC2016 # runs in the guest's shell
          "$hermit" run -d --name calm debian.tar sh -c 'trap "echo bye; exit 0" TERM; while :; do sleep 1; done' > /dev/null
          "$hermit" stop calm
          "$hermit" ps -a | grep ' calm$' | grep -q 'Exited (0)' || { "$hermit" ps -a; exit 1; }
          [ "$("$hermit" logs calm)" = bye ]
          # One that ignores it (sleep as PID 1 has no handler) is killed when -t runs out.
          "$hermit" run -d --name stubborn debian.tar sleep 1000 > /dev/null
          start=$SECONDS
          "$hermit" stop -t 3 stubborn
          (( SECONDS - start >= 3 )) || { echo "::error::stop -t 3 took $(( SECONDS - start ))s"; exit 1; }
          "$hermit" ps -a | grep ' stubborn$' | grep -q 'Exited (137)'
          # kill passes any signal on.
          # shellcheck disable=SC2016 # runs in the guest's shell
          "$hermit" run -d --name hup debian.tar sh -c 'trap "echo hup; exit 9" HUP; while :; do sleep 1; done' > /dev/null
          "$hermit" kill -s HUP hup
          [ "$("$hermit" logs -f hup)" = hup ]
          "$hermit" ps -a | grep ' hup$' | grep -q 'Exited (9)'
          # A foreground run passes the signals it gets on to its container, as docker run does.
          # shellcheck disable=SC2016 # runs in the guest's shell
          "$hermit" run debian.tar sh -c 'trap "echo caught; exit 5" TERM; echo ready; while :; do sleep 1; done' > fg.out &
          fg=$!
          for _ in $(seq 120); do grep -q ready fg.out && break; sleep 1; done
          kill -TERM "$fg"
          code=0; wait "$fg" || code=$?
          [ "$code" = 5 ] && [ "$(cat fg.out)" = $'ready\ncaught' ] || { echo "::error::exit $code: $(cat fg.out)"; exit 1; }
      - name: Show the sandbox console
        if: ${{ !cancelled() }}
        run: cat "${{ runner.temp }}"/oci-hermit/sandbox-*/console.log "${{ runner.temp }}"/oci-hermit/sandbox-*/qemu.log || true
      # The guest files and the image for the hosts job: they run inside the guest, so any host can use them.
      - uses: actions/upload-artifact@v7
        with:
          name: sandbox-${{ matrix.arch }}
          path: |
            guest/out/sandbox/${{ matrix.arch }}
            debian.tar
          retention-days: 14
          if-no-files-found: error
      # Also when the boot test fails, so the kernel can be booted and debugged elsewhere.
      - if: ${{ !cancelled() && (steps.kernel.outcome == 'success' || steps.kernel-cache.outputs.cache-hit == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: oci-hermit-kernel-${{ matrix.arch }}
          path: guest/out/${{ matrix.arch }}
          retention-days: 14

  # A Linux image on every host oci-hermit supports, for both guest architectures: no root or admin rights, no WSL,
  # no hypervisor; QEMU emulates the whole guest (TCG). The guest kernel, agent and image come from the kernel jobs.
  hosts:
    name: Run a Linux image (${{ matrix.host }} host, ${{ matrix.arch }} guest)
    needs: kernel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        host: [win-64, osx-arm64, osx-64, linux-64, linux-aarch64]
        arch: [x86_64, aarch64]
        include:
          - { host: win-64, os: windows-latest }
          - { host: osx-arm64, os: macos-latest }
          - { host: osx-64, os: macos-15-intel }
          - { host: linux-64, os: ubuntu-latest }
          - { host: linux-aarch64, os: ubuntu-24.04-arm }
    env:
      OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
      OCI_HERMIT_GUEST_DIR: ${{ github.workspace }}/guest/out/sandbox
    steps:
      - uses: actions/checkout@v7
      # Built as qemu.yml builds it, only when its inputs change; the key matches the kernel jobs' on Linux.
      - name: Cache the QEMU bundle
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: qemu/out
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qemu/build.sh', 'qemu/patches/**', 'packaging/licenses.py', 'pixi.lock') }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ runner.os == 'Windows' && 'default package' || 'default qemu-build package' }}
          cache: true
      - if: steps.qemu-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        name: Build the QEMU bundle
        run: pixi run -e qemu-build qemu-build
      - if: steps.qemu-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            patch
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
      - if: steps.qemu-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        name: Build the QEMU bundle (MSYS2)
        shell: msys2 {0}
        run: |
          python -m pip install --break-system-packages "qemu.qmp==0.0.6"
          bash qemu/build.sh qemu/out
      - name: Fetch the guest kernel, agent and Debian image
        uses: actions/download-artifact@v8
        with:
          name: sandbox-${{ matrix.arch }}
      # Release, so the timings below match what users get.
      - name: Build oci-hermit
        run: pixi run cargo build -q --release -p oci-hermit
      # Sandboxes keep their logs under the temp directory; they are shown at the end.
      - name: Use the runner's temp directory
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Boot a sandbox
        shell: bash
        run: target/release/oci-hermit machine boot --arch "${{ matrix.arch }}" --timeout 600
      - name: Run commands from the Debian image
        shell: bash
        run: |
          set -euo pipefail
          hermit=target/release/oci-hermit
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          case "$RUNNER_OS" in
            Windows) host=$(cmd //c ver | tr -d '\r' | grep -v '^$') ;;
            macOS) host="macOS $(sw_vers -productVersion) on $(uname -m)" ;;
            *) host="$(. /etc/os-release; echo "$PRETTY_NAME") on $(uname -m)" ;;
          esac
          # shellcheck disable=SC2016 # expands in the guest's shell
          show='. /etc/os-release; echo "$PRETTY_NAME on $(uname -m), kernel $(uname -r)"; id; exit 7'

          # Output and the exit code come back. No --platform (#19): the archive holds one architecture, and on a
          # host of the other kind oci-hermit runs it anyway, under the matching emulated guest, with a warning.
          set +e
          out=$("$hermit" run debian.tar sh -c "$show" 2> "$RUNNER_TEMP/run-stderr.txt")
          code=$?
          set -e
          echo "$out"
          cat "$RUNNER_TEMP/run-stderr.txt"
          [ "$code" = 7 ] || { echo "::error::exit code $code, expected 7"; exit 1; }
          grep -q '^Debian GNU/Linux 12' <<< "$out"
          grep -q " on ${{ matrix.arch }}," <<< "$out" || { echo "::error::not a ${{ matrix.arch }} guest"; exit 1; }
          warning=$(grep '^WARNING' "$RUNNER_TEMP/run-stderr.txt" || true)

          # Piped stdin reaches the command.
          piped=$(echo "piped from the host" | "$hermit" run -i --platform "$platform" debian.tar cat)
          [ "$piped" = "piped from the host" ] || { echo "::error::stdin came back as '$piped'"; exit 1; }

          # With -t the command gets a terminal in the guest (the runner has no console to put in raw mode).
          set +e
          tty=$("$hermit" run -t --platform "$platform" debian.tar sh -c 'tty; exit 3' | tr -d '\r')
          code=${PIPESTATUS[0]}
          set -e
          echo "$tty"
          [ "$code" = 3 ] || { echo "::error::exit code $code with -t, expected 3"; exit 1; }
          grep -q '/dev/pts/' <<< "$tty"

          # -u runs the command as another user from the image's /etc/passwd, with that user's HOME.
          # shellcheck disable=SC2016 # expands in the guest's shell
          who=$("$hermit" run -u nobody --platform "$platform" debian.tar sh -c 'id; echo "HOME=$HOME"')
          echo "$who"
          expected=$'uid=65534(nobody) gid=65534(nogroup) groups=65534(nogroup)\nHOME=/nonexistent'
          [ "$who" = "$expected" ] || { echo "::error::-u nobody ran as '$who'"; exit 1; }

          # -d leaves the container running after run returns, under its own monitor; logs shows its output and
          # stop sends it SIGTERM, which it traps and exits 0 on. Its ID goes to a file, not $(...): on Windows the monitor inherits the
          # shell's stdout pipe and $(...) never returns (#105).
          # shellcheck disable=SC2016 # expands in the guest's shell
          "$hermit" run -d --name ticker --platform "$platform" debian.tar sh -c 'trap "exit 0" TERM; echo started; while true; do sleep 1; done' < /dev/null > ticker.id 2> ticker.err || { cat ticker.err; exit 1; }
          id=$(tr -d '\r\n' < ticker.id)
          [[ "$id" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::run -d printed '$id'"; exit 1; }
          "$hermit" ps | grep -q ' ticker$' || { echo "::error::ticker is not running"; "$hermit" ps -a; exit 1; }
          for _ in $(seq 120); do
            [ "$("$hermit" logs ticker | tr -d '\r')" = started ] && break
            sleep 1
          done
          [ "$("$hermit" logs ticker | tr -d '\r')" = started ] || { echo "::error::logs: $("$hermit" logs ticker)"; exit 1; }
          # exec joins it, with its own exit code and stdin.
          code=0; inside=$("$hermit" exec ticker sh -c 'tr "\0" " " < /proc/1/cmdline; exit 6') || code=$?
          [ "$code" = 6 ] || { echo "::error::exec exited with $code, not 6"; exit 1; }
          [[ "$(tr -d '\r' <<< "$inside")" == "sh -c trap \"exit 0\" TERM; echo started;"* ]] || { echo "::error::exec saw PID 1 as '$inside'"; exit 1; }
          [ "$(echo piped | "$hermit" exec -i ticker cat | tr -d '\r')" = piped ]
          "$hermit" stop ticker
          "$hermit" ps -a | grep ' ticker$' | grep -q 'Exited (0)' || { "$hermit" ps -a; exit 1; }
          "$hermit" rm ticker

          {
            echo "## ${{ matrix.host }} host, ${{ matrix.arch }} guest"
            echo
            echo "Host: $host. No root or admin rights, no WSL, no hypervisor: QEMU TCG."
            echo
            echo '```console'
            echo "$ oci-hermit run debian.tar sh -c '...; exit 7'"
            if [ -n "$warning" ]; then echo "$warning"; fi
            echo "$out"
            echo "(exit code 7)"
            echo "$ echo \"piped from the host\" | oci-hermit run -i --platform $platform debian.tar cat"
            echo "$piped"
            echo "$ oci-hermit run -t --platform $platform debian.tar sh -c 'tty; exit 3'"
            echo "$tty"
            echo "(exit code 3)"
            echo "$ oci-hermit run -u nobody --platform $platform debian.tar sh -c 'id; echo \"HOME=\$HOME\"'"
            echo "$who"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # #14: pull by reference over HTTPS (every digest checked), then run it from the store by name.
      - name: Pull from a registry and run by name
        shell: bash
        env:
          OCI_HERMIT_DATA_DIR: ${{ runner.temp }}/hermit-data
        run: |
          set -euo pipefail
          hermit=target/release/oci-hermit
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          image=mirror.gcr.io/library/debian:bookworm-slim
          pulled=$("$hermit" pull --platform "$platform" "$image")
          echo "$pulled"
          grep -q "^Status: pulled $image for $platform$" <<< "$pulled"
          # shellcheck disable=SC2016 # expands in the guest's shell
          out=$("$hermit" run --platform "$platform" "$image" sh -c '. /etc/os-release; echo "$PRETTY_NAME"')
          echo "$out"
          grep -q '^Debian GNU/Linux 12' <<< "$out"
          {
            echo
            echo "### Pulled from a registry"
            echo
            echo '```console'
            echo "$ oci-hermit pull --platform $platform $image"
            echo "$pulled"
            echo "$ oci-hermit run --platform $platform $image sh -c '. /etc/os-release; echo \"\$PRETTY_NAME\"'"
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # #17: a stored image runs from its layer disks, stacked with overlayfs under a throwaway writable layer.
      # Writes land in that layer only: the disks do not change, and the next run sees the image as it was.
      - name: Writes stay in the sandbox
        shell: bash
        env:
          OCI_HERMIT_DATA_DIR: ${{ runner.temp }}/hermit-data
        run: |
          set -euo pipefail
          hermit=target/release/oci-hermit
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          image=mirror.gcr.io/library/debian:bookworm-slim
          disks="$OCI_HERMIT_DATA_DIR/images/erofs/1"
          before=$(cd "$disks" && sha256sum ./*.erofs)
          echo "$before"
          # shellcheck disable=SC2016 # runs in the guest's shell
          out=$("$hermit" run --platform "$platform" "$image" sh -c \
            'echo changed > /etc/debian_version; rm /usr/bin/tac; cat /etc/debian_version;
             test -e /usr/bin/tac && echo tac-there || echo tac-gone; grep " / " /proc/mounts' | tr -d '\r')
          echo "$out"
          grep -q '^changed$' <<< "$out"
          grep -q '^tac-gone$' <<< "$out"
          grep -q '^overlay / overlay ' <<< "$out" || { echo "::error::the root is not overlayfs"; exit 1; }
          # shellcheck disable=SC2016 # runs in the guest's shell
          again=$("$hermit" run --platform "$platform" "$image" sh -c \
            'cat /etc/debian_version; test -e /usr/bin/tac && echo tac-there' | tr -d '\r')
          echo "$again"
          grep -q '^12\.' <<< "$again" || { echo "::error::the next run saw the change"; exit 1; }
          grep -q '^tac-there$' <<< "$again"
          after=$(cd "$disks" && sha256sum ./*.erofs)
          [ "$before" = "$after" ] || { echo "::error::a layer disk changed"; exit 1; }
          who=$("$hermit" run -u nobody --platform "$platform" "$image" sh -c 'id -un' | tr -d '\r')
          [ "$who" = nobody ] || { echo "::error::-u nobody on layer disks ran as '$who'"; exit 1; }
          {
            echo
            echo "### Layer disks"
            echo
            echo '```console'
            echo "$ oci-hermit run $image sh -c 'echo changed > /etc/debian_version; rm /usr/bin/tac; ...'"
            echo "$out"
            echo "$ oci-hermit run $image sh -c 'cat /etc/debian_version; ...'"
            echo "$again"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # #18: the image commands on the pulled image: tag, save, remove, load back, run by short ID.
      - name: Manage the pulled image
        shell: bash
        env:
          OCI_HERMIT_DATA_DIR: ${{ runner.temp }}/hermit-data
        run: |
          set -euo pipefail
          hermit=target/release/oci-hermit
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          image=mirror.gcr.io/library/debian:bookworm-slim
          "$hermit" tag "$image" hermit-test/debian:1
          listed=$("$hermit" images)
          echo "$listed"
          grep -q "^docker.io/hermit-test/debian .* $platform " <<< "$listed"
          "$hermit" image exists hermit-test/debian:1
          if "$hermit" image exists hermit-test/debian:2; then echo "::error::image exists said yes"; exit 1; fi
          id=$("$hermit" images -q hermit-test/debian:1)
          "$hermit" inspect "$id" | grep -q '"RepoTags"'
          "$hermit" image history "$image" | head -3
          "$hermit" save -o "$RUNNER_TEMP/debian-saved.tar" hermit-test/debian:1
          "$hermit" rmi -f "$id"
          if "$hermit" image exists "$id"; then echo "::error::rmi left $id"; exit 1; fi
          "$hermit" system df
          "$hermit" load -i "$RUNNER_TEMP/debian-saved.tar"
          # In sh -c, because Git Bash on Windows rewrites a bare /etc/... argument into a Windows path.
          # shellcheck disable=SC2016 # runs in the guest's shell
          version=$("$hermit" run --platform "$platform" "${id:0:6}" sh -c 'cat /etc/debian_version' | tr -d '\r')
          [ "${version%%.*}" = 12 ] || { echo "::error::ran ${id:0:6} and got '$version'"; exit 1; }
          {
            echo
            echo "### Image commands"
            echo
            echo '```console'
            echo "$ oci-hermit images"
            echo "$listed"
            echo "$ oci-hermit save -o debian-saved.tar hermit-test/debian:1; oci-hermit rmi -f $id; oci-hermit load -i debian-saved.tar"
            echo "$ oci-hermit run ${id:0:6} cat /etc/debian_version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # #15: what `docker save` writes, loaded offline and run by name; and (#18) what `oci-hermit save` writes,
      # loaded by Docker and Podman. Only the Ubuntu runners have both.
      - name: Load a docker save archive
        if: matrix.host == 'linux-64'
        shell: bash
        env:
          OCI_HERMIT_DATA_DIR: ${{ runner.temp }}/hermit-load
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          image=mirror.gcr.io/library/debian:bookworm-slim
          for attempt in 1 2 3 4; do
            docker pull --platform "$platform" "$image" && break
            sleep $((attempt * 5))
          done
          docker save --platform "$platform" -o "$RUNNER_TEMP/debian-docker.tar" "$image"
          loaded=$(target/release/oci-hermit load -i "$RUNNER_TEMP/debian-docker.tar")
          echo "$loaded"
          grep -q "^Loaded image: $image ($platform)$" <<< "$loaded"
          # shellcheck disable=SC2016 # expands in the guest's shell
          out=$(target/release/oci-hermit run --platform "$platform" "$image" sh -c '. /etc/os-release; echo "$PRETTY_NAME"')
          echo "$out"
          grep -q '^Debian GNU/Linux 12' <<< "$out"

          # #18, the other way: what `oci-hermit save` writes, read by Docker and Podman.
          target/release/oci-hermit save -o "$RUNNER_TEMP/hermit-saved.tar" "$image"
          docker rmi "$image"
          docker load -i "$RUNNER_TEMP/hermit-saved.tar"
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image" | grep -qx "$platform"
          podman load -i "$RUNNER_TEMP/hermit-saved.tar"
          podman image exists "$image"
          {
            echo
            echo "### Loaded from docker save"
            echo
            echo '```console'
            echo "$ docker save -o debian-docker.tar $image"
            echo "$ oci-hermit load -i debian-docker.tar"
            echo "$loaded"
            echo "$ oci-hermit run --platform $platform $image sh -c '. /etc/os-release; echo \"\$PRETTY_NAME\"'"
            echo "$out"
            echo "$ oci-hermit save -o hermit-saved.tar $image"
            echo "$ docker load -i hermit-saved.tar; podman load -i hermit-saved.tar   # both succeed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure the time to a shell
        shell: bash
        env:
          OCI_HERMIT_TIMINGS: "1"
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          {
            echo
            echo "### Time to a shell"
            echo
            echo "\`oci-hermit run --platform $platform debian.tar bash -ic exit\`, three runs, seconds:"
            echo
            echo "| Run | Prepare | Boot | Command | Stop | Total |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2 3; do
            line=$(target/release/oci-hermit run --platform "$platform" debian.tar bash -ic exit 2>&1 >/dev/null | tr -d '\r' | grep '^timings:')
            echo "$line"
            # "timings: prepare 0.27s, boot 1.10s, ..." -> "| 1 | 0.27 | 1.10 | ..."
            echo "| $run | $(sed -E -e 's/^timings: //' -e 's/[a-z]+ ([0-9.]+)s/\1/g' -e 's/, / | /g' <<< "$line") |" >> "$GITHUB_STEP_SUMMARY"
          done
      # #13: the same image again, run by a fresh account with no admin rights from a folder it cannot write to.
      - name: Run as a standard user (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          platform=$([ "${{ matrix.arch }}" = x86_64 ] && echo linux/amd64 || echo linux/arm64)
          if [ "$RUNNER_OS" = macOS ]; then
            sudo sysadminctl -addUser hermit -password "$(uuidgen)" 2> /dev/null
            membership=$(dseditgroup -o checkmember -m hermit admin || true)
            grep -q 'NOT a member' <<< "$membership"
          else
            sudo useradd --create-home hermit
            membership="hermit is in: $(id -nG hermit)"
            if grep -qwE 'sudo|admin|adm|wheel|kvm|docker|lxd' <<< "$(id -nG hermit)"; then
              echo "::error::$membership"
              exit 1
            fi
            # Take KVM away entirely, so a run that worked cannot have used it.
            if [ -e /dev/kvm ]; then sudo chmod 0600 /dev/kvm; fi
          fi

          install=/opt/oci-hermit
          sudo mkdir -p "$install"
          sudo cp target/release/oci-hermit debian.tar "$install/"
          sudo cp -R qemu/out "$install/qemu"
          sudo cp -R guest/out/sandbox "$install/guest"
          sudo chown -R root "$install"
          sudo chmod -R go-w,a+rX "$install"
          tmp=$(sudo -u hermit mktemp -d /tmp/hermit.XXXXXX)
          as_hermit() {
            sudo -u hermit env -i PATH=/usr/bin:/bin HOME="$tmp" TMPDIR="$tmp" \
              OCI_HERMIT_QEMU_DIR="$install/qemu" OCI_HERMIT_GUEST_DIR="$install/guest" "$@"
          }

          id=$(as_hermit id)
          echo "$id"
          if as_hermit sudo -n true 2> /dev/null; then
            echo "::error::hermit can use sudo"
            exit 1
          fi
          if as_hermit test -w "$install"; then
            echo "::error::hermit can write to $install"
            exit 1
          fi
          kvm=$([ -e /dev/kvm ] && ls -l /dev/kvm || echo "no /dev/kvm")

          set +e
          # shellcheck disable=SC2016 # expands in the guest's shell
          out=$(as_hermit "$install/oci-hermit" run --platform "$platform" "$install/debian.tar" \
            sh -c '. /etc/os-release; echo "$PRETTY_NAME on $(uname -m)"; exit 7')
          code=$?
          set -e
          echo "$out"
          [ "$code" = 7 ] || { echo "::error::exit code $code as a standard user, expected 7"; exit 1; }
          grep -q '^Debian GNU/Linux 12' <<< "$out"

          {
            echo
            echo "### As a standard user"
            echo
            echo "A new account with no admin rights ran oci-hermit from \`$install\`, which it cannot write to."
            echo "\`sudo -n true\` failed for it. KVM: $kvm."
            echo
            echo '```console'
            echo "$ id"
            echo "$id"
            echo "$membership"
            echo "$ oci-hermit run --platform $platform debian.tar sh -c '...; exit 7'"
            echo "$out"
            echo "(exit code 7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run as a standard user (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = if ('${{ matrix.arch }}' -eq 'x86_64') { 'linux/amd64' } else { 'linux/arm64' }
          $password = ConvertTo-SecureString ('Hx1!' + [guid]::NewGuid()) -AsPlainText -Force
          New-LocalUser -Name hermit -Password $password -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member hermit

          # Installed where only administrators can write, with a work folder the account owns.
          $install = 'C:\oci-hermit'
          $work = 'C:\hermit-work'
          # Start-Process -Credential hands the account this runner's environment, so TMP and LOCALAPPDATA (where
          # run records its containers) are pointed at folders it owns, as its own would be.
          New-Item -ItemType Directory $install, $work, "$work\tmp", "$work\AppData\Local" | Out-Null
          Copy-Item target\release\oci-hermit.exe, debian.tar $install
          Copy-Item -Recurse qemu\out "$install\qemu"
          Copy-Item -Recurse guest\out\sandbox "$install\guest"
          @"
          @echo off
          set TMP=$work\tmp
          set TEMP=$work\tmp
          set LOCALAPPDATA=$work\AppData\Local
          set OCI_HERMIT_QEMU_DIR=$install\qemu
          set OCI_HERMIT_GUEST_DIR=$install\guest
          whoami > $work\whoami.txt
          whoami /groups /fo csv > $work\groups.txt
          whoami /priv /fo csv > $work\priv.txt
          (echo x> $install\probe.txt) 2> nul && echo writable> $work\install-writable.txt
          $install\oci-hermit.exe run --platform $platform $install\debian.tar sh -c ". /etc/os-release; echo `$PRETTY_NAME on `$(uname -m); exit 7" > $work\out.txt 2> $work\err.txt
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Encoding ascii "$install\as-hermit.cmd"
          icacls $install /inheritance:r /grant:r 'Administrators:(OI)(CI)F' 'SYSTEM:(OI)(CI)F' 'Users:(OI)(CI)RX' | Out-Null
          icacls $work /inheritance:r /grant:r 'Administrators:(OI)(CI)F' 'SYSTEM:(OI)(CI)F' 'hermit:(OI)(CI)M' | Out-Null

          $credential = New-Object System.Management.Automation.PSCredential('hermit', $password)
          $p = Start-Process cmd.exe -ArgumentList '/c', "$install\as-hermit.cmd" -Credential $credential `
            -WorkingDirectory $work -LoadUserProfile -Wait -PassThru
          $code = $p.ExitCode
          $whoami = (Get-Content "$work\whoami.txt" -Raw).Trim()
          $groups = Get-Content "$work\groups.txt" -Raw
          $privileges = Get-Content "$work\priv.txt" -Raw
          $out = "$(Get-Content "$work\out.txt" -Raw)".Trim()
          Write-Output "whoami: $whoami" $groups $privileges $out
          Get-Content "$work\err.txt"

          if ($whoami -notmatch '\\hermit$') { throw "ran as $whoami, not hermit" }
          if ($groups -match 'S-1-5-32-544') { throw 'hermit is in the Administrators group' }
          if ($groups -notmatch 'Medium Mandatory Level') { throw 'hermit does not run at medium integrity' }
          if (Test-Path "$work\install-writable.txt") { throw "hermit can write to $install" }
          if ($code -ne 7) { throw "exit code $code as a standard user, expected 7" }
          if ($out -notmatch '^Debian GNU/Linux 12') { throw "unexpected output: $out" }
          if (-not (Get-ChildItem "$work\AppData\Local\oci-hermit\containers" -Directory)) {
            throw 'run did not record its container in the account''s data folder'
          }

          $summary = @(
            '', '### As a standard user', '',
            "A new account in the Users group only ran oci-hermit from ``$install``, which it cannot write to.",
            'It is not in Administrators (S-1-5-32-544) and runs at medium integrity, with no elevation.', '',
            '```console', "> whoami", $whoami, '> whoami /groups (names only)',
            (($groups | ConvertFrom-Csv).'Group Name' -join "`n"),
            "> oci-hermit run --platform $platform debian.tar sh -c '...; exit 7'", $out, '(exit code 7)', '```'
          )
          $summary -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
      # A ready-to-run folder for this host (docs/getting-started.md), built as a release builds it (packaging/package.py):
      # oci-hermit and hrmt, its QEMU bundle, both guests, and their licenses. Packaged once per host, from the x86_64
      # job; releases (release.yml) are built the same way from a tag.
      - if: matrix.arch == 'x86_64'
        name: Fetch the aarch64 guest for the package
        uses: actions/download-artifact@v8
        with:
          name: sandbox-aarch64
          path: ${{ runner.temp }}/aarch64-guest
      - if: matrix.arch == 'x86_64'
        id: package
        name: Package oci-hermit for this host
        shell: bash
        run: |
          set -euo pipefail
          temp=$(cygpath -u "$RUNNER_TEMP" 2> /dev/null || echo "$RUNNER_TEMP")
          exe=oci-hermit$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p "$temp/guests"
          cp -R guest/out/sandbox/x86_64 "$temp/guests/"
          cp -R "$temp/aarch64-guest/guest/out/sandbox/aarch64" "$temp/guests/"
          version="$("target/release/$exe" version | awk '{print $2}')-dev.${GITHUB_SHA::7}"
          pixi run -e package python -I packaging/package.py --host "${{ matrix.host }}" --version "$version" \
            --exe "target/release/$exe" --qemu qemu/out --guest "$temp/guests" --out "$temp/package" \
            --archive-name "oci-hermit-${{ matrix.host }}" --keep-dir
          dir="$temp/package/oci-hermit"

          # The folder alone is enough: no OCI_HERMIT_* settings, under either name.
          unset OCI_HERMIT_QEMU_DIR OCI_HERMIT_GUEST_DIR
          hrmt=hrmt$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          "$dir/$hrmt" --help | grep -q "^Usage: hrmt "
          "$dir/$exe" machine info
          for arch in x86_64 aarch64; do "$dir/$hrmt" machine boot --arch "$arch" --timeout 600; done
          grep -q "^  qemu 11" "$dir/THIRD-PARTY-LICENSES"
          grep -q "^  linux " "$dir/THIRD-PARTY-LICENSES"

          # Artifacts are zipped, which loses the executable bit and symlinks, so Linux and macOS get the tarball;
          # Windows gets the folder itself.
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$temp/artifact"
            # A copy, not a move: just after QEMU exits, Windows can still hold a file in the folder for a moment
            # (Defender scans it, the job object closes), and renaming a folder with an open file fails.
            cp -R "$dir" "$temp/artifact/"
            printf 'path=%s\\artifact\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          else
            echo "path=$temp/package/oci-hermit-${{ matrix.host }}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: oci-hermit-${{ matrix.host }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 14
          if-no-files-found: error
      - name: Show the sandbox console
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP" 2> /dev/null || echo "$RUNNER_TEMP")
          cat "$temp"/oci-hermit/sandbox-*/console.log "$temp"/oci-hermit/sandbox-*/qemu.log || true
          # The standard user's sandboxes, from the steps above.
          if [ "$RUNNER_OS" = Windows ]; then
            cat /c/hermit-work/tmp/oci-hermit/sandbox-*/*.log /c/hermit-work/*.txt 2> /dev/null || true
          else
            sudo sh -c 'cat /tmp/hermit.*/oci-hermit/sandbox-*/*.log' 2> /dev/null || true
          fi
