name: QEMU bundle

# Builds the TCG-only QEMU bundle (qemu/build.sh) on every host oci-hermit supports, and checks that the host tool
# accepts it. Runs when the build or the code that checks it changes, on main, and by hand.
on:
  push:
    branches: ["main"]
    paths:
      - qemu/**
      - crates/oci-hermit/src/qemu.rs
      - pixi.toml
      - pixi.lock
      - .github/workflows/qemu.yml
  pull_request:
    paths:
      - qemu/**
      - crates/oci-hermit/src/qemu.rs
      - pixi.toml
      - pixi.lock
      - .github/workflows/qemu.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unix:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-latest, platform: osx-arm64 }
          - { os: macos-15-intel, platform: osx-64 }
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: qemu-build default
          cache: true
      - name: Build the bundle
        run: pixi run -e qemu-build qemu-build
      - name: The host tool accepts it
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}/qemu/out
        run: pixi run cargo run -q -p oci-hermit -- machine info
      - name: Package
        run: tar -czf "oci-hermit-qemu-${{ matrix.platform }}.tar.gz" -C qemu/out .
      - uses: actions/upload-artifact@v7
        with:
          name: oci-hermit-qemu-${{ matrix.platform }}
          path: oci-hermit-qemu-${{ matrix.platform }}.tar.gz
          retention-days: 14

  windows:
    name: Build (win-64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            patch
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libslirp
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-python-wheel
      # configure's Python venv needs qemu.qmp, which MSYS2 does not package; the build itself runs with
      # --disable-download, so it is installed here, pinned to the version QEMU 11.1.3 asks for.
      - name: Install qemu.qmp
        shell: msys2 {0}
        run: python -m pip install --break-system-packages "qemu.qmp==0.0.6"
      - name: Build the bundle
        shell: msys2 {0}
        run: bash qemu/build.sh qemu/out
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          cache: true
      - name: The host tool accepts it
        env:
          OCI_HERMIT_QEMU_DIR: ${{ github.workspace }}\qemu\out
        run: pixi run cargo run -q -p oci-hermit -- machine info
      - name: Package
        shell: msys2 {0}
        run: tar -czf oci-hermit-qemu-win-64.tar.gz -C qemu/out .
      - uses: actions/upload-artifact@v7
        with:
          name: oci-hermit-qemu-win-64
          path: oci-hermit-qemu-win-64.tar.gz
          retention-days: 14
