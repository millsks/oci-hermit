name: CI

on:
  push:
    branches: ["main"]
  # Every pull request, whatever its base, so a PR stacked on another one is checked too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces the run; every commit on main gets a complete one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --all --check
          pixi run lint
          pixi run check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: pixi run test
      - name: Smoke test CLI
        run: pixi run cargo run -q -p oci-hermit -- version
      # The layer disks (#16) against erofs-utils, the reference EROFS tools: fsck.erofs checks the image, and the
      # tree it extracts must match what the builder meant to write. Root, because whiteouts extract as devices.
      - name: Check layer disks with fsck.erofs
        if: runner.os == 'Linux'
        env:
          OCI_HERMIT_EROFS_SAMPLES: ${{ runner.temp }}/erofs-samples
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q erofs-utils
          pixi run cargo test -q -p oci-hermit writes_a_sample_for_fsck_erofs
          sudo sh crates/oci-hermit/testdata/fsck-erofs.sh "$OCI_HERMIT_EROFS_SAMPLES"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  deny:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: lint
          cache: true
      - name: cargo deny
        run: pixi run -e lint deny

  # Every other job builds on the newer rustc the default environment pins; this one proves the MSRV.
  msrv:
    name: Builds on the MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: msrv
          cache: true
          activate-environment: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on the oldest supported toolchain
        run: pixi run -e msrv msrv-check

  # The guest agent as the VM will run it: a static binary per guest architecture, built natively.
  agent:
    name: Static guest agent (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      AGENT: target/${{ matrix.target }}/release/hermit-agent
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: agent
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: |
          pixi run -e agent which cc
          pixi run -e agent agent-build
      - name: Statically linked
        run: |
          file "$AGENT"
          file "$AGENT" | grep -Eq 'statically linked|static-pie linked'
          ls -l "$AGENT"
      - name: Refuses to start as a normal process
        run: |
          status=0
          "$AGENT" 2> refusal.txt || status=$?
          cat refusal.txt
          test "$status" -eq 1
          grep -q 'must run as PID 1' refusal.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hermit-agent-${{ matrix.target }}
          path: ${{ env.AGENT }}
          if-no-files-found: error

  # The one check a branch protection rule needs to require.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [lint, test, coverage, deny, msrv, agent]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a job ended $result"; exit 1 ;;
            esac
          done
