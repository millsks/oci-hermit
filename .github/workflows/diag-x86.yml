name: Diagnose x86_64 agent (#54)

# Temporary, on the #54 branch only; removed before merge. Boots three programs as /init under x86_64 microvm on
# three CPU models: a no-libc probe, a static-glibc probe built like the agent, and the agent with symbols.
on:
  push:
    branches: ["bugfix/x86-agent-start"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe the x86_64 guest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: kernel-build qemu-build agent default
          cache: true
      - name: Cache the QEMU bundle
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: qemu/out
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('qemu/build.sh', 'pixi.lock') }}
      - name: Build the QEMU bundle
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: pixi run -e qemu-build qemu-build
      - name: Cache the kernel
        id: kernel-cache
        uses: actions/cache@v6
        with:
          path: guest/out/x86_64
          key: kernel-x86_64-${{ hashFiles('guest/kernel/**', 'pixi.lock') }}
      - name: Build the kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: pixi run -e kernel-build kernel-build x86_64 guest/out/x86_64
      - name: Build the probes and an unstripped agent
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
        run: |
          mkdir -p diag
          pixi run -e agent cc -static -nostdlib -ffreestanding -fno-stack-protector -O2 -o diag/nolibc guest/diag/nolibc.c
          pixi run -e agent cc -static -nostdlib -ffreestanding -fno-stack-protector -O2 -DEXIT_AFTER_WRITE \
            -o diag/nolibc-exit guest/diag/nolibc.c
          pixi run -e agent cc -static -no-pie -O2 -o diag/glibc guest/diag/glibc.c
          pixi run -e agent agent-build
          cp target/x86_64-unknown-linux-gnu/release/hermit-agent diag/agent
          file diag/*
      - name: Boot each program on each CPU model
        run: |
          image=$(sed -n 's/^image=//p' guest/out/x86_64/BUNDLE.txt)
          for program in nolibc nolibc-exit glibc agent; do
            for cpu in qemu64 Haswell-v4 max; do
              bash guest/diag/run.sh "$program" "diag/$program" qemu/out "guest/out/x86_64/$image" "$cpu" \
                "$RUNNER_TEMP/d" 30 | tee -a diag/results.txt
            done
          done
      - name: Name the faulting instructions
        run: |
          # Nearest symbol at or below each trapping address, in the program that trapped.
          # shellcheck disable=SC2016 # $1, $2 and $1 in awk belong to the inner shell and awk
          grep -oE '^RESULT [a-z-]+ .*ip:[0-9a-f]+' diag/results.txt | sort -u | while read -r _ program rest; do
            ip=${rest##*ip:}
            echo "== $program 0x$ip"
            pixi run -e agent bash -c '"${NM:-nm}" -n "$1" | awk -v ip="$2" '"'"'
              { a = strtonum("0x" $1) } a <= strtonum("0x" ip) { best = $0 } END { print best }'"'"'' \
              _ "diag/$program" "$ip" || true
          done
      - name: Summary
        if: ${{ !cancelled() }}
        run: grep '^RESULT' diag/results.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: diag-x86
          path: |
            diag
            ${{ runner.temp }}/d/*.log
          retention-days: 7
