[workspace]
name = "oci-hermit"
description = "Run OCI images in a sealed, software-emulated sandbox without root, admin or a hypervisor"
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
license = "Apache-2.0"
exclude-newer = "7d"

[dependencies]
rust = "==1.99.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt --all"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
check = "cargo check --workspace --all-targets"
test = "cargo test --workspace"
build = "cargo build --workspace --release"

# The oldest toolchain the workspace claims to build on. `pixi run -e msrv msrv-check` proves the number in
# Cargo.toml rather than trusting it.
[feature.msrv.dependencies]
rust = "==1.85.0"

[feature.msrv.tasks]
msrv-check = "cargo check --workspace --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
actionlint = ">=1.7.12,<2"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml.
deny = "cargo deny check"
actionlint = "actionlint"
pre-commit-run = "pre-commit run --all-files"

[feature.cov.dependencies]
cargo-llvm-cov = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --workspace --all-targets --fail-under-lines 90"

# Build dependencies for the bundled QEMU (qemu/build.sh). Windows builds in MSYS2 instead: conda-forge has no
# libslirp for win-64, and QEMU does not build with MSVC.
[feature.qemu-build]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[feature.qemu-build.dependencies]
c-compiler = "*"
# libfdt, for the aarch64 `virt` machine's device tree.
dtc = ">=1.6"
glib = ">=2.66"
libslirp = ">=4.7"
meson = ">=1.5"
ninja = "*"
pkg-config = "*"
python = "3.14.*"
# configure's Python venv; with --disable-download it must find these instead of fetching them from PyPI.
"qemu.qmp" = "==0.0.6"
setuptools = "*"
wheel = "*"
pip = "*"
make = "*"
# QEMU requires zlib; without it in the environment meson falls back to the host's /usr/include.
zlib = "*"

[feature.qemu-build.target.linux.dependencies]
patchelf = "*"

[feature.qemu-build.tasks]
qemu-build = "bash qemu/build.sh qemu/out"

# The static guest agent (`pixi run -e agent agent-build`), built natively on each Linux architecture. conda-forge
# ships no musl Rust std, so it is a static glibc binary: crt-static, linked by the environment's `cc` (conda-forge
# gcc) against conda-forge's 2.39 sysroot.
[feature.agent]
platforms = ["linux-64", "linux-aarch64"]

[feature.agent.target.linux-64.dependencies]
sysroot_linux-64 = "2.39.*"

[feature.agent.target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = "2.39.*"

[feature.agent.target.linux-64.tasks.agent-build]
cmd = "cargo build -p hermit-agent --release --locked --target x86_64-unknown-linux-gnu"
env = { CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-C target-feature=+crt-static" }

[feature.agent.target.linux-aarch64.tasks.agent-build]
cmd = "cargo build -p hermit-agent --release --locked --target aarch64-unknown-linux-gnu"
env = { CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-C target-feature=+crt-static" }

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
qemu-build = { features = ["qemu-build"], no-default-feature = true }
agent = ["agent"]
