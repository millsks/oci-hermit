[workspace]
name = "oci-hermit"
description = "Run OCI images in a sealed, software-emulated sandbox without root, admin or a hypervisor"
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
license = "Apache-2.0"
exclude-newer = "7d"

[dependencies]
rust = "==1.99.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt --all"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
check = "cargo check --workspace --all-targets"
test = "cargo test --workspace"
build = "cargo build --workspace --release"

# The oldest toolchain the workspace claims to build on. `pixi run -e msrv msrv-check` proves the number in
# Cargo.toml rather than trusting it.
[feature.msrv.dependencies]
rust = "==1.85.0"

[feature.msrv.tasks]
msrv-check = "cargo check --workspace --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
actionlint = ">=1.7.12,<2"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml.
deny = "cargo deny check"
actionlint = "actionlint"
pre-commit-run = "pre-commit run --all-files"

[feature.cov.dependencies]
cargo-llvm-cov = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --workspace --all-targets --fail-under-lines 90"

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
