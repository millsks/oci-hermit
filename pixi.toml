[workspace]
name = "oci-hermit"
description = "Run OCI images in a sealed, software-emulated sandbox without root, admin or a hypervisor"
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
license = "Apache-2.0"
exclude-newer = "7d"

[dependencies]
rust = "==1.99.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt --all"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
check = "cargo check --workspace --all-targets"
test = "cargo test --workspace"
build = "cargo build --workspace --release"

# The oldest toolchain the workspace claims to build on. `pixi run -e msrv msrv-check` proves the number in
# Cargo.toml rather than trusting it.
[feature.msrv.dependencies]
rust = "==1.89.0"

[feature.msrv.tasks]
msrv-check = "cargo check --workspace --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
actionlint = ">=1.7.12,<2"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml.
deny = "cargo deny check"
actionlint = "actionlint"
pre-commit-run = "pre-commit run --all-files"

[feature.cov.dependencies]
cargo-llvm-cov = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --workspace --all-targets --fail-under-lines 90"

# Build dependencies for the bundled QEMU (qemu/build.sh). Windows builds in MSYS2 instead: conda-forge has no
# libslirp for win-64, and QEMU does not build with MSVC.
[feature.qemu-build]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[feature.qemu-build.dependencies]
c-compiler = "*"
# libfdt, for the aarch64 `virt` machine's device tree.
dtc = ">=1.6"
glib = ">=2.66"
libslirp = ">=4.7"
meson = ">=1.5"
ninja = "*"
pkg-config = "*"
python = "3.14.*"
# configure's Python venv; with --disable-download it must find these instead of fetching them from PyPI.
"qemu.qmp" = "==0.0.6"
setuptools = "*"
wheel = "*"
pip = "*"
make = "*"
# QEMU requires zlib; without it in the environment meson falls back to the host's /usr/include.
zlib = "*"

[feature.qemu-build.target.linux.dependencies]
patchelf = "*"

[feature.qemu-build.tasks]
qemu-build = "bash qemu/build.sh qemu/out"

# Build dependencies for the guest kernel (guest/kernel/build.sh). Kernels build natively on Linux only.
[feature.kernel-build]
platforms = ["linux-64", "linux-aarch64"]

[feature.kernel-build.dependencies]
# gcc and binutils under target-prefixed names; build.sh passes the prefix as CROSS_COMPILE.
c-compiler = "*"
make = "*"
flex = "*"
bison = "*"
bc = "*"
perl = "*"
gawk = "*"
# libelf, for objtool on x86-64.
elfutils = "*"
pkg-config = "*"
# Kernel image compression (zstd) and the built-in initramfs (gzip); xz unpacks the tarball.
zstd = "*"
gzip = "*"
xz = "*"

[feature.kernel-build.tasks]
# Arguments pass through: `pixi run -e kernel-build kernel-build [arch] [out-dir]`.
kernel-build = "bash guest/kernel/build.sh"

# The static guest agent (`pixi run -e agent agent-build`), built natively on each Linux architecture. conda-forge
# ships no musl Rust std, so it is a static glibc binary: crt-static, linked by the environment's `cc` (conda-forge
# gcc) against conda-forge's 2.39 sysroot. Non-PIE (relocation-model=static): a static-pie build segfaults at startup.
[feature.agent]
platforms = ["linux-64", "linux-aarch64"]

[feature.agent.target.linux-64.dependencies]
sysroot_linux-64 = "2.39.*"

[feature.agent.target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = "2.39.*"

[feature.agent.target.linux-64.tasks.agent-build]
cmd = "cargo build -p hermit-agent --release --locked --target x86_64-unknown-linux-gnu"
env = { CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-C target-feature=+crt-static -C relocation-model=static" }

[feature.agent.target.linux-aarch64.tasks.agent-build]
cmd = "cargo build -p hermit-agent --release --locked --target aarch64-unknown-linux-gnu"
env = { CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "-C target-feature=+crt-static -C relocation-model=static" }

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

# The documentation site (mkdocs.yml), set up as pixi-sbom's is. Its toolchain comes from PyPI rather than
# conda-forge, the one place this project departs from conda-forge-first: conda-forge's only mkdocs 1.6.1 build
# declares `click >=7.0,<8.3.0a0`, which holds click on 8.2.1 (PYSEC-2026-2132, a command injection in
# `click.edit()`). mkdocs' own metadata asks for `click>=7.0`; the cap is the packaging, not the code. Revisit when
# conda-forge ships an mkdocs build without it.
[feature.docs.dependencies]
python = "3.14.*"
# Conda-side, so the PyPI solve sees it as already satisfied and cannot pull a capped one.
click = ">=8.3.3"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6"
pymdown-extensions = ">=10"
mike = ">=2.1"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

# Release packaging (packaging/package.py, release.yml): Python for the scripts, git-cliff for the release notes.
[feature.package.dependencies]
python = "3.14.*"
git-cliff = ">=2"

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
qemu-build = { features = ["qemu-build"], no-default-feature = true }
kernel-build = { features = ["kernel-build"], no-default-feature = true }
agent = ["agent"]
package = ["package"]
