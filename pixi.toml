[workspace]
name = "oci-hermit"
description = "Run OCI images in a sealed, software-emulated sandbox without root, admin or a hypervisor"
authors = ["Kevin Mills"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
license = "Apache-2.0"

[dependencies]
rust = ">=1.85"

[tasks]
build = "cargo build --workspace"
test = "cargo test --workspace"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all -- --check"
lint = "cargo clippy --workspace --all-targets -- -D warnings"
check = { depends-on = ["fmt-check", "lint", "test"] }
