[package]
name = "oci-hermit"
description = "Run OCI images in a sealed, software-emulated sandbox without root, admin or a hypervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oci-hermit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
hermit-proto.workspace = true
flate2.workspace = true
tar.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rustls.workspace = true
# `signal`: a foreground run passes Ctrl-C and SIGTERM on to its container (#25).
tokio = { workspace = true, features = ["signal"] }
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
# Named pipes for the containers' monitors (#22), blocked on from plain threads.
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }

[lints]
workspace = true

[dev-dependencies]
rcgen.workspace = true
