[workspace]
resolver = "2"
members = ["crates/oci-hermit", "crates/hermit-agent", "crates/hermit-proto"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/millsks/oci-hermit"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hermit-proto = { path = "crates/hermit-proto" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
