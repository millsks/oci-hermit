[workspace]
resolver = "2"
members = ["crates/oci-hermit", "crates/hermit-agent", "crates/hermit-proto"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/millsks/oci-hermit"
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hermit-proto = { path = "crates/hermit-proto", version = "0.2.0" }
# Reading OCI image layers: gzip and tar, pure Rust.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
# The host terminal in raw mode for `run -t`, on Linux, macOS and Windows.
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
# Pulling from registries (#14) and `login` (#75): the distribution API's reads over reqwest (registry.rs), run on a
# one-thread tokio runtime. TLS is rustls with the ring provider, which builds without CMake or NASM on every host;
# sha256 verifies every manifest and blob against its digest.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
sha2 = "0.11"
# Tests only: a CA, a registry certificate and a client certificate for the TLS test registry (#86).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Windows only: QEMU runs in a Job Object that kills it when oci-hermit exits (QEMU has no exit-with-parent there).
win32job = "2.1"
# Guest agent only (Linux): safe wrappers for mount, sync, reboot, signal masks and waitpid.
nix = { version = "0.32.0", default-features = false, features = [
  "fs",
  "mount",
  "poll",
  "process",
  "reboot",
  "signal",
  "socket",
  "term",
  "uio",
  "user",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
