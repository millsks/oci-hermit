[workspace]
resolver = "2"
members = ["crates/oci-hermit", "crates/hermit-agent", "crates/hermit-proto"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/millsks/oci-hermit"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hermit-proto = { path = "crates/hermit-proto", version = "0.0.0" }
# Windows only: QEMU runs in a Job Object that kills it when oci-hermit exits (QEMU has no exit-with-parent there).
win32job = "2.1"
# Guest agent only (Linux): safe wrappers for mount, sync, reboot, signal masks and waitpid.
nix = { version = "0.32.0", default-features = false, features = ["fs", "mount", "reboot", "signal"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
