repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Vendored as published, byte for byte: its sha256 is recorded.
        exclude: ^crates/hermit-agent/seccomp/default\.json$
      - id: trailing-whitespace
        # A unified diff's blank context lines are a single space; vendored files stay as published.
        exclude: ^(qemu/patches/|crates/hermit-agent/seccomp/default\.json$)
      - id: check-yaml
        # mkdocs.yml names a Python function with a !!python/name tag (the Mermaid fence); check its syntax only.
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: pixi run cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: pixi run cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: taplo
        name: taplo
        entry: pixi run taplo format
        language: system
        types: [toml]
      - id: typos
        name: typos
        entry: pixi run typos
        language: system
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: pixi run actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
