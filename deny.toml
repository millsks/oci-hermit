# What this project will accept in its own dependency tree. `pixi run deny` checks it locally; CI runs it on every
# pull request and on main.

[graph]
# Only what we ship: default features, for the targets releases will be built for.
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# Every RUSTSEC advisory fails the build. One with no fix yet goes here with the issue that tracks getting off it.
ignore = [
  # chrono is unmaintained, no fix; it comes in through oci-client (#91).
  { id = "RUSTSEC-2026-0543", reason = "transitive through oci-client, no fixed version (#91)" },
]

[licenses]
version = 2
# The permissive set. QEMU (GPL-2.0) is never a crate dependency: it ships as a separate helper process.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
